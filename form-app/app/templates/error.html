<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}</title>
<style>
  /* 瀏覽器開頁面出錯時顯示（例：不是管理者卻開 /admin）；配色同 index.html、admin.html，直角 */
  :root {
    color-scheme: light;
    --bg: #f5f5f5; --paper: #ffffff; --line: rgba(0, 0, 0, 0.12);
    --text: rgba(0, 0, 0, 0.87); --text-2: rgba(0, 0, 0, 0.6);
    --primary: #1976d2; --primary-hover: #1565c0; --on-primary: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #212121; --paper: #121212; --line: rgba(255, 255, 255, 0.12);
      --text: #ffffff; --text-2: rgba(255, 255, 255, 0.7);
      --primary: #90caf9; --primary-hover: #64b5f6; --on-primary: rgba(0, 0, 0, 0.87);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.6;
    padding: 48px 16px;
  }
  .card { max-width: 480px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); padding: 24px; }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 500; }
  h1 span { display: block; }
  p { margin: 0 0 4px; color: var(--text-2); }
  .actions { margin-top: 20px; }
  .btn {
    display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px;
    background: var(--primary); color: var(--on-primary); text-decoration: none; font-weight: 500;
  }
  .btn:hover { background: var(--primary-hover); }
</style>
<body>
  <main class="card">
    <h1>{% for part in title.split(" / ") %}<span>{{ part }}</span>{% endfor %}</h1>
    {% for line in lines %}<p>{{ line }}</p>{% endfor %}
    <div class="actions"><a class="btn" href="/">回表單首頁 / Back to the form</a></div>
  </main>
</body>
</html>
